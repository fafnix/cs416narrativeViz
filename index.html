<html>
    <head>
        <script src='https://d3js.org/d3.v7.min.js'></script>
        <script>console.log("D3 is running on version: " + d3.version);</script>
        <script src = "https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
        <script>console.log("D3-Annotation is loaded: " + (typeof d3.annotation == "function"));</script>
    </head>
<body>
    <p>TODO: Put introduction and discussion of first chart here.</p>
    <svg id = "chart1"></svg>
    <p>TODO: Put discussion of second chart here.</p>
    <svg id = "chart2"></svg>
    <p>TODO: Put discussion of third chart here.</p>
    <svg id = "chart3"></svg>

    <!-- hove-over tooltip to just show x and y values on line-->
    <div id="tooltip" style="position: absolute; opacity: 0; background: lightgrey; border: 1px solid black; pointer-events: none; font-size: 12px;"></div>


<script type = "module">
    //set chart dimensions, generally following https://d3js.org/getting-started
    const width = 800;
    const height = 600;
    const marginTop = 40;
    const marginRight = 40;
    const marginBottom = 40;
    const marginLeft = 40;
    const chartWidth = width - marginRight - marginLeft;
    const chartHeight = height - marginTop - marginBottom;

    const data = await d3.csv("UNRATE.csv");

    //parse the date -- https://d3js.org/d3-time-format
    const dateFormat = d3.timeParse("%Y-%m-%d");
    data.forEach(d => {
        d.observation_date = dateFormat(d.observation_date);
        //max for UNRATE was wrong (string instead of numerical) until -- https://stackoverflow.com/questions/49406725/d3-max-not-returning-the-max-value-in-an-array
        d.UNRATE = +d.UNRATE;
    });

    function buildChart(idOfSvg, data, yearRange, annotations){
        const minYear = yearRange.minYear;
        const maxYear = yearRange.maxYear;

        const filteredRange = data.filter(d =>
            d.observation_date.getFullYear() >= minYear &&
            d.observation_date.getFullYear() <= maxYear
        );

        const svg = d3.select("#" + idOfSvg)
            .attr("width", width).attr("height", height)
            .append("g")
            .attr("transform", "translate(" + marginLeft + ", " + marginTop + ")");

        const x = d3.scaleTime()
            .domain([d3.min(filteredRange, d => d.observation_date), d3.max(filteredRange, d => d.observation_date)])
            .range([0 , chartWidth])

        const y = d3.scaleLinear()
            .domain([0 , d3.max(filteredRange, d => d.UNRATE) * 1.2])
            .range([chartHeight , 0])

        //line helper function per https://d3-graph-gallery.com/graph/shape.html#myline
        var lineXYParse = d3.line()
            .x(function(d , i){return x(d.observation_date);})
            .y(function(d , i){return y(d.UNRATE);})

        svg.append('path')
            .datum(filteredRange)
            .attr('d', lineXYParse)
            .attr('stroke', 'black')
            .attr('fill','none');

        svg.append("g")
            .attr("transform", "translate(0, " + chartHeight + ")")
            .call(d3.axisBottom(x));
    
        svg.append("g")
            .call(d3.axisLeft(y));

        //following https://d3-graph-gallery.com/graph/line_cursor.html
        //to add ability to hover over chart and see x and y values from line
        var bisect = d3.bisector(function(d){return d.observation_date;}).left;

        var circleOfFocus = svg.append('circle')
            .style("fill", "none")
            .attr("stroke", "black")
            .attr("r", 3)
            .style("opacity", 0);

        var tooltipXy = d3.select("#tooltip");

        svg
            .append('rect')
            .style("fill", "none")
            .style("pointer-events", "all")
            .attr('width', chartWidth)
            .attr('height', chartHeight)
            .on('mouseover', mouseover)
            .on('mousemove', mousemove)
            .on('mouseout', mouseout);
        
        function mouseover() {
            circleOfFocus.style("opacity", 1);
            tooltipXy.style("opacity", 1);
        }

        function mousemove(event) {
            var x0 = x.invert(d3.pointer(event)[0]);
            var i = bisect(filteredRange, x0, 1);
            const selectedData = filteredRange[i];

            circleOfFocus
                .attr("cx", x(selectedData.observation_date))
                .attr("cy", y(selectedData.UNRATE));

            tooltipXy
                .html("Date: " + selectedData.observation_date.toDateString() + "<br>Unemployment Rate: " + selectedData.UNRATE + "%")
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 30) + "px");
        }

        function mouseout() {
            circleOfFocus.style("opacity", 0);
            tooltipXy.style("opacity", 0);
        }

        //annotations
        const addAnnotations = d3.annotation()
            .annotations(annotations);
            
        svg.append("g")
            .attr("class", "annotation-group")
            .call(addAnnotations);
    }

    const chart1Annotations = [
        {
            note: {
                label: "Nov 1988 -- Adam Born",
                title: "Adam's Birthday"
            },
            x: x(filteredRange[100].observation_date),
            y: y(filteredRange[100].UNRATE),
            dy: 10,
            dx: 10
        }   
    ];

    buildChart("chart1", data, {minYear:1985,maxYear:2014}, chart1Annotations);
    buildChart("chart2", data, {minYear:1985,maxYear:2023}, []);
    buildChart("chart3", data, {minYear:1948,maxYear:2026}, []);

</script>
</body>
</html>
